<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galaxy Simulation</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #canvas { display: block; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
    }
    #controls button {
      margin-top: 10px;
      padding: 5px 10px;
      cursor: pointer;
    }
    #drawCanvas {
      position: absolute;
      top: 0;
      left: 100%;
      width: 100%;
      height: 100%;
      transition: left 0.5s ease-in-out;
      display: none;
    }
    #drawCanvas.active {
      left: 0;
      display: block;
    }
    #drawControls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
    }
    #drawControls.active {
      display: block;
    }
    #drawControls button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 0 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #drawControls #generateGalaxyButton {
      background-color: #007bff;
      color: white;
    }
    #drawControls #generateGalaxyButton:hover {
      background-color: #0056b3;
    }
    #drawControls #clearCanvasButton {
      background-color: #dc3545;
      color: white;
    }
    #drawControls #clearCanvasButton:hover {
      background-color: #b02a37;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <h2>Controls</h2>
    <p>Left hold -> Move Camera</p>
    <p>Right hold -> Pan Camera</p>
    <p>Scroll Wheel -> Zoom in/out</p>
    <p>M -> Toggle GUI</p>
    <button onclick="generateStatic()">Regenerate Galaxy</button>
    <button onclick="showDrawCanvas()">Draw Galaxy</button>
    <h3>Config</h3>
    <label>NUM_STARS: <input type="number" id="NUM_STARS" value="3500" /></label><br />
    <label>GALAXY_THICKNESS: <input type="number" id="GALAXY_THICKNESS" value="5" /></label><br />
    <label>CORE_X_DIST: <input type="number" id="CORE_X_DIST" value="33" /></label><br />
    <label>CORE_Y_DIST: <input type="number" id="CORE_Y_DIST" value="33" /></label><br />
    <label>OUTER_CORE_X_DIST: <input type="number" id="OUTER_CORE_X_DIST" value="169" /></label><br />
    <label>OUTER_CORE_Y_DIST: <input type="number" id="OUTER_CORE_Y_DIST" value="169" /></label><br />
    <label>ARM_X_DIST: <input type="number" id="ARM_X_DIST" value="100" /></label><br />
    <label>ARM_Y_DIST: <input type="number" id="ARM_Y_DIST" value="50" /></label><br />
    <label>ARM_X_MEAN: <input type="number" id="ARM_X_MEAN" value="200" /></label><br />
    <label>ARM_Y_MEAN: <input type="number" id="ARM_Y_MEAN" value="100" /></label><br />
    <label>SPIRAL: <input type="number" id="SPIRAL" value="3.0" /></label><br />
    <label>ARMS: <input type="number" id="ARMS" value="2.0" /></label><br />
    <label>BAR_LENGTH: <input type="number" id="BAR_LENGTH" value="100" /></label><br />
    <label>BAR_WIDTH: <input type="number" id="BAR_WIDTH" value="20" /></label><br />
    <label>HALO_RADIUS: <input type="number" id="HALO_RADIUS" value="300" /></label><br />
    <label>HALO_DENSITY: <input type="number" id="HALO_DENSITY" value="0.1" step="0.01" /></label><br />
    <label>ARM_PITCH: <input type="number" id="ARM_PITCH" value="3.0" /></label><br />
    <label>STAR_SIZE_VARIANCE: <input type="number" id="STAR_SIZE_VARIANCE" value="0.3" step="0.01" /></label><br />
    <label>NEBULA_DENSITY: <input type="number" id="NEBULA_DENSITY" value="0.05" step="0.01" /></label><br />
    <label>NEBULA_SCALE_MIN: <input type="number" id="NEBULA_SCALE_MIN" value="5" /></label><br />
    <label>NEBULA_SCALE_MAX: <input type="number" id="NEBULA_SCALE_MAX" value="15" /></label><br />
    <label>SHADER_TYPE: 
      <select id="SHADER_TYPE">
        <option value="composition">Composition (Default)</option>
        <option value="blackwhite">Black & White</option>
        <option value="invert">Invert (Fun)</option>
        <option value="rainbowcycle">Rainbow Cycle</option>
        <option value="heatmap">Heatmap</option>
      </select>
    </label>
  </div>
  <canvas id="drawCanvas"></canvas>
  <div id="drawControls">
    <button id="generateGalaxyButton">Generate Galaxy</button>
    <button id="clearCanvasButton">Clear Canvas</button>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import { config } from './config/galaxyConfig.js';
    import { initDrawCanvas } from './drawCanvas.js';

    // Toggle controls visibility with 'M' key
    document.addEventListener('keydown', (event) => {
      if (event.key.toLowerCase() === 'm') {
        const controls = document.getElementById('controls');
        controls.style.display = controls.style.display === 'none' ? 'block' : 'none';
      }
    });

    // Update config and regenerate galaxy on input change
    const inputs = document.querySelectorAll('#controls input, #controls select');
    inputs.forEach(input => {
      input.addEventListener('change', () => {
        const key = input.id;
        const value = input.type === 'number' ? parseFloat(input.value) : input.value;
        config[key] = value;
        window.regenerateGalaxy();
      });
    });

    // Show draw canvas
    window.showDrawCanvas = () => {
      const drawCanvas = document.getElementById('drawCanvas');
      const drawControls = document.getElementById('drawControls');
      if (drawCanvas && drawControls) {
        drawCanvas.classList.add('active');
        drawControls.classList.add('active');
        document.getElementById('controls').style.display = 'none';
        initDrawCanvas();
      }
    };
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
