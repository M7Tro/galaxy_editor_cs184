    #drawCanvas {
      position: absolute;
      top: 0;
      left: 100%;
      width: 100%;
      height: 100%;
      transition: left 0.5s ease-in-out;
      display: none;
      z-index: 2; /* Above 3D canvas, below controls */
    }
    #drawCanvas.active {
      left: 0;
      display: block;
    }
    #drawControls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 3; /* Above drawCanvas */
    }
    #drawControls.active {
      display: block;
    }
    #drawControls button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 0 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #drawControls #generateGalaxyButton {
      background-color: #007bff;

    #drawControls #generateGalaxyButton:hover {
      background-color: #0056b3;

    #drawControls #clearCanvasButton {
